# Copy to config.properties (the build also creates that ignored file automatically).
# This example contains no personal configuration.

# Optional TMDB API token. Native Russian TV recommendations and bundled nature photos do not require it.
# Upstream web/LG/Samsung code still uses TMDB for its recommendations.
tmdb_key=
tmdb_region=RU

# Generic sample location. Set your own city's decimal coordinates and optional display name.
latitude=40.7128
longitude=-74.0060
city=

# auto follows the TV; also en, es, pt, ru, de.
language=auto

# Legacy setting name: on Android, true enables USD/RUB and EUR/RUB from the Central Bank of Russia.
# The inherited web/LG/Samsung implementation still interprets it as cryptocurrency quotes.
show_crypto=true

# Used by the inherited web implementation. Android fiat quotes are always RUB.
currency=RUB

# C, F or auto.
temperature=auto

# Keep voice search enabled. true disables the supported Google Assistant packages.
disable_assistant=false
